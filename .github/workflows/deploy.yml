# Baut die App bei jeder Änderung, prüft sie automatisch und stellt sie erst dann
# auf GitHub Pages online: https://koni-99.github.io/Hinkel-lern-theke/
# Schlägt die Prüfung fehl, bleibt die bisherige Version online.
name: App online stellen

on:
  push:
    branches: [claude/app-github-development-hn3cz2, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: App bauen
        run: npx react-scripts build
        env:
          PUBLIC_URL: /Hinkel-lern-theke
          CI: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'

      # ── Automatische Prüfung (tests/app-test.js) ──
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Browser für die Prüfung installieren
        run: npx playwright install --with-deps chromium
      - name: App prüfen (Seiten, Quiz, Spiele, Ausbilder, Anmeldung, Live-Updates)
        run: |
          node tests/serve.js build 5055 /Hinkel-lern-theke &
          cd tests
          npx -y firebase-tools@15.36.0 emulators:exec --only database --project demo-hinkel \
            "EMU=http://127.0.0.1:9000 node app-test.js http://127.0.0.1:5055/Hinkel-lern-theke/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
