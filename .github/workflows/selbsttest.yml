# Prüft jede Nacht die Online-App (https://koni-99.github.io/Hinkel-lern-theke/), ohne sich anzumelden.
# Schlägt die Prüfung fehl, schickt GitHub eine E-Mail. Von Hand starten: Actions → Täglicher Selbsttest → Run workflow.
name: Täglicher Selbsttest

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selbsttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Browser installieren
        run: npx playwright install --with-deps chromium
      - name: Online-App prüfen
        run: node tests/selbsttest.js https://koni-99.github.io/Hinkel-lern-theke/
