<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zum Abschalten</title>
<!-- Erzeugt von tools/abschalten/baue.py. Nicht von Hand ändern, sondern die Dateien in tools/abschalten und dann neu bauen. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Eine Spalte wie in der App: oben die 6 Spiele als Karten, darunter das Spielfeld (Leinwand 360 × 480) */
:root{
  --bg:#F3EADB; --karte:#FFFBF2; --ink:#2B170A; --muted:#7A6450; --line:#E5D6BE; --gelb:#FFC72C; --braun:#4B2A14;
  --display:"Fraunces", Georgia, serif; --text:"Plus Jakarta Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15110C;--karte:#221B14;--ink:#F5EBDD;--muted:#BBA88F;--line:#3A2F24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15110C;--karte:#221B14;--ink:#F5EBDD;--muted:#BBA88F;--line:#3A2F24;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2A1A10;color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;overflow:hidden}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.kopf{display:flex;flex-direction:column;gap:4px}
.kopf small{font-weight:800;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:15px}
.wahl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wahl button{position:relative;min-height:68px;border-radius:16px;border:none;background:var(--karte);color:var(--ink);font:800 14px/1.15 var(--text);cursor:pointer;padding:8px 6px;box-shadow:0 1px 2px rgba(31,20,12,.06),0 8px 18px -12px rgba(31,20,12,.45);transition:transform .15s}
.wahl button:active{transform:scale(.97)}
.wahl button[aria-pressed="true"]{background:linear-gradient(160deg,#5A3820,#3A2010);color:#FFE9B0;box-shadow:0 10px 22px -10px rgba(58,32,16,.8)}
.wahl small{display:block;font-weight:600;font-size:11.5px;opacity:.75;margin-top:2px}
.wahl .rek{display:block;font-size:11px;font-weight:700;color:#C98A00;margin-top:2px}
button:focus-visible{outline:3px solid #7B2FF7;outline-offset:2px}
.feld{position:relative;width:100%;height:100%;overflow:hidden;background:#2A1A10;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none;z-index:2}
.pille{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 8px;border-radius:999px;background:linear-gradient(180deg,rgba(255,252,244,.94),rgba(255,243,220,.9));color:#2B170A;font:800 14px/1 var(--text);font-variant-numeric:tabular-nums;box-shadow:0 4px 10px -4px rgba(31,20,12,.45),inset 0 1px 0 #fff;white-space:nowrap}
.pille i{display:inline-flex;width:17px;height:17px}.pille i svg{width:100%;height:100%}
.pille i.herz{width:15px;height:15px;margin-right:-2px}
.ueber{position:absolute;inset:0;z-index:4;display:flex;align-items:safe center;justify-content:center;padding:14px;overflow-y:auto;background:radial-gradient(120% 80% at 50% 30%,rgba(43,23,10,.35),rgba(20,10,4,.78));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:einblenden .3s ease}
.ueber .karte{width:100%;max-width:300px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 16px 16px;margin:auto 0;border-radius:22px;background:linear-gradient(180deg,#FFFBF2,#FFF1D6);color:#2B170A;text-align:center;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 #fff;animation:hoch .45s cubic-bezier(.2,1.4,.4,1)}
.ueber .marke{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#8A6A3A;background:#FFF0C2;padding:4px 10px;border-radius:999px}
.ueber .marke.gold{background:linear-gradient(90deg,#FFC72C,#FFE58A,#FFC72C);color:#4B2A14;animation:glanz 1.6s ease-in-out infinite}
.ueber h2{margin:0;font-family:var(--display);font-size:30px;line-height:1.05}
.ueber p{margin:0;font-size:13.5px;color:#6B5640;line-height:1.45}
.ueber .zahl{font-family:var(--display);font-size:54px;line-height:1;font-weight:800;color:#4B2A14;font-variant-numeric:tabular-nums}
.ueber .rekord{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#8A6A3A}.ueber .rekord svg{width:16px;height:16px}
.ueber .los{margin-top:4px;min-height:54px;min-width:200px;border:none;border-radius:16px;padding:0 24px;font:800 18px var(--text);cursor:pointer;color:#2B170A;background:linear-gradient(180deg,#FFD95A,#F2B400);box-shadow:0 6px 0 #B98200,0 12px 22px -8px rgba(185,130,0,.8);transition:transform .1s,box-shadow .1s}
.ueber .los:active{transform:translateY(4px);box-shadow:0 2px 0 #B98200}
.frage{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:linear-gradient(180deg,#FFFBF2,#FFF1D6);color:#2B170A;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 40px -10px rgba(0,0,0,.55);animation:hoch .4s cubic-bezier(.2,1.4,.4,1)}
.frage.raus{animation:runter .22s ease forwards}
.frage-kopf{display:flex;justify-content:space-between;align-items:center;gap:8px}
.frage-marke{font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;background:#4B2A14;color:#FFD86B;padding:4px 10px;border-radius:999px}
.frage-hinweis{font-size:12px;color:#8A6A3A;font-weight:700}
.frage p{margin:2px 0;font-weight:700;font-size:16px;line-height:1.35}
.frage .opt{min-height:46px;border:none;border-radius:14px;padding:8px 14px;text-align:left;font:700 15px var(--text);color:#2B170A;background:#FFFFFF;box-shadow:0 3px 0 #E7D3AE;cursor:pointer;transition:transform .1s}
.frage .opt:active{transform:translateY(2px)}
.frage .opt.ok{background:#D6F0CF;box-shadow:0 3px 0 #8DC27E}.frage .opt.nein{background:#F8D5CC;box-shadow:0 3px 0 #D8907E}
.frage .weg{border:none;background:transparent;color:#8A6A3A;font:700 14px var(--text);text-decoration:underline;min-height:36px;cursor:pointer}
.info{background:var(--karte);border-radius:18px;padding:12px 14px;box-shadow:0 1px 2px rgba(31,20,12,.06),0 8px 18px -14px rgba(31,20,12,.45)}
.info strong{display:block;font-size:17px}
.info p{margin:2px 0 0;color:var(--muted);font-size:15px}
@keyframes einblenden{from{opacity:0}}
@keyframes hoch{from{opacity:0;transform:translateY(26px) scale(.96)}}
@keyframes runter{to{opacity:0;transform:translateY(26px)}}
@keyframes glanz{50%{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){.ueber,.ueber .karte,.frage,.ueber .marke.gold{animation:none}}
</style>
</head>
<body>
<div class="feld" id="feld">
  <canvas id="c" aria-label="Spielfeld"></canvas>
  <div class="hud" id="hud"></div>
  <div class="ueber" id="ueber"></div>
</div>
<script>
const TEIGI_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="232" height="232" viewBox="2 6 116 116"><defs><filter id="weichtgr0" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"></feGaussianBlur></filter><filter id="glowtgr0" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter><linearGradient id="goldtgr0" x1="0" x2="1"><stop offset="0" stop-color="#8C5A0A"></stop><stop offset=".18" stop-color="#E0A400"></stop><stop offset=".38" stop-color="#FFF4C2"></stop><stop offset=".55" stop-color="#FFC72C"></stop><stop offset=".8" stop-color="#B8860B"></stop><stop offset="1" stop-color="#6E440A"></stop></linearGradient><linearGradient id="goldToptgr0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF7D6"></stop><stop offset=".6" stop-color="#FFD24A"></stop><stop offset="1" stop-color="#C9901A"></stop></linearGradient><linearGradient id="glastgr0" x1="0" x2="1"><stop offset="0" stop-color="#E7B65A" stop-opacity=".45"></stop><stop offset=".1" stop-color="#FFFFFF" stop-opacity=".25"></stop><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset=".9" stop-color="#FFFFFF" stop-opacity=".2"></stop><stop offset="1" stop-color="#E7B65A" stop-opacity=".5"></stop></linearGradient><radialGradient id="teigtgr0" cx="45%" cy="25%" r="85%"><stop offset="0" stop-color="#FFF0C4"></stop><stop offset=".4" stop-color="#F8D27A"></stop><stop offset=".78" stop-color="#E8A93E"></stop><stop offset="1" stop-color="#C07A1E"></stop></radialGradient><radialGradient id="blasetgr0" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".55" stop-color="#FFF4DE" stop-opacity=".7"></stop><stop offset="1" stop-color="#C9954E" stop-opacity=".8"></stop></radialGradient><radialGradient id="augetgr0" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#4A2810"></stop><stop offset=".55" stop-color="#1C0E05"></stop><stop offset="1" stop-color="#000000"></stop></radialGradient><linearGradient id="kantetgr0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient><radialGradient id="bodentgr0"><stop offset="0" stop-color="#000" stop-opacity=".5"></stop><stop offset="1" stop-color="#000" stop-opacity="0"></stop></radialGradient><radialGradient id="weisstgr0" cx="35%" cy="25%" r="80%"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset=".7" stop-color="#F6F0E4"></stop><stop offset="1" stop-color="#D9CCB2"></stop></radialGradient><linearGradient id="rottgr0" x1="0" x2="1"><stop offset="0" stop-color="#8E1B12"></stop><stop offset=".4" stop-color="#E0372A"></stop><stop offset="1" stop-color="#9A2015"></stop></linearGradient><linearGradient id="rosatgr0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB3C7"></stop><stop offset=".6" stop-color="#E8577A"></stop><stop offset="1" stop-color="#A82A50"></stop></linearGradient><linearGradient id="linsetgr0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A3A30"></stop><stop offset="1" stop-color="#0E0907"></stop></linearGradient></defs><ellipse cx="60" cy="121" rx="40" ry="7" fill="url(#bodentgr0)"></ellipse><g><ellipse cx="60" cy="70" rx="44" ry="50" fill="#FFC72C" opacity=".2" filter="url(#glowtgr0)"></ellipse><path d="M28 40c0-7 4-10 11-10h42c7 0 11 3 11 10v62c0 12-7 18-19 18H47c-12 0-19-6-19-18z" fill="#FFFDF7" opacity=".92"></path><path d="M28 40c0-7 4-10 11-10h42c7 0 11 3 11 10v62c0 12-7 18-19 18H47c-12 0-19-6-19-18z" fill="#FFF3DC" opacity=".55"></path><path d="M31 60q8 -10 15 -1t15 0 15 0 13 -1V102c0 10-5 15-15 15H47c-10 0-16-5-16-15z" fill="url(#teigtgr0)"></path><g><circle cx="40" cy="96" r="3.4" fill="url(#blasetgr0)"></circle><circle cx="80" cy="102" r="2.6" fill="url(#blasetgr0)"></circle><circle cx="74" cy="72" r="2.1" fill="url(#blasetgr0)"></circle><circle cx="62" cy="108" r="2" fill="url(#blasetgr0)"></circle><circle cx="50" cy="106" r="2.8" fill="url(#blasetgr0)"></circle><circle cx="84" cy="88" r="1.8" fill="url(#blasetgr0)"></circle><circle cx="36" cy="104" r="1.6" fill="url(#blasetgr0)"></circle><circle cx="40" cy="68" r="2.4" fill="url(#blasetgr0)"></circle><circle cx="70" cy="112" r="2.2" fill="url(#blasetgr0)"></circle><circle cx="82" cy="70" r="1.6" fill="url(#blasetgr0)"></circle></g><g filter="url(#weichtgr0)" fill="#FF7A6E" opacity=".65"><ellipse cx="41" cy="92" rx="6" ry="3.6"></ellipse><ellipse cx="79" cy="92" rx="6" ry="3.6"></ellipse></g><g><ellipse cx="48" cy="81" rx="7.2" ry="8.2" fill="url(#augetgr0)"></ellipse><ellipse cx="45.8" cy="78" rx="2.8" ry="3" fill="#FFFFFF"></ellipse><circle cx="50.4" cy="84.4" r="1.2" fill="#FFFFFF" opacity=".85"></circle></g><g><ellipse cx="72" cy="81" rx="7.2" ry="8.2" fill="url(#augetgr0)"></ellipse><ellipse cx="69.8" cy="78" rx="2.8" ry="3" fill="#FFFFFF"></ellipse><circle cx="74.4" cy="84.4" r="1.2" fill="#FFFFFF" opacity=".85"></circle></g><g><path d="M51 92q9 10.5 18 0q-9 3 -18 0z" fill="#1C0E05"></path><path d="M56 97.4q4 -3.2 8 0q-4 2.6 -8 0z" fill="#E8534F"></path></g><path d="M28 40c0-7 4-10 11-10h42c7 0 11 3 11 10v62c0 12-7 18-19 18H47c-12 0-19-6-19-18z" fill="url(#glastgr0)" stroke="#E7B65A" stroke-width="3"></path><path d="M35 40v58" stroke="url(#kantetgr0)" stroke-width="4.6" stroke-linecap="round" opacity=".9"></path><path d="M42 42v12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".7"></path><path d="M88 46v52" stroke="#FFE7A8" stroke-width="1.6" stroke-linecap="round" opacity=".6"></path><path d="M60 31q12 -9 29 -5q2 3 1 5z" fill="url(#teigtgr0)"></path><g transform="translate(0 -3) rotate(-6 60 24)"><rect x="30" y="17" width="60" height="14" rx="3" fill="url(#goldtgr0)"></rect><path d="M33.2 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M36.4 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M39.6 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M42.8 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M46 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M49.2 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M52.400000000000006 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M55.6 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M58.8 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M62 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M65.2 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M68.4 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M71.6 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M74.80000000000001 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M78 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M81.2 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M84.4 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><path d="M87.6 20v11" stroke="#7A4A0A" stroke-opacity=".35" stroke-width="1"></path><ellipse cx="60" cy="18" rx="30" ry="3.6" fill="url(#goldToptgr0)"></ellipse><path d="M35 16.6h44" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity=".85"></path><rect x="30" y="29" width="60" height="2.2" fill="#6E440A" opacity=".45"></rect></g></g></svg>`;

// ═══ Zum Abschalten: gemeinsame Grundlage (Leinwand, Schleife, Effekte, hochwertige Zeichnungen) ═══
// Logische Fläche 360 × 480, wird scharf auf die echte Größe skaliert.
const W = 360, H = 480;
const c = document.getElementById('c'), x = c.getContext('2d');
const feld = document.getElementById('feld'), hud = document.getElementById('hud'), ueber = document.getElementById('ueber');
let SKAL = 1;
function groesse(){ const dpr = Math.min(2.5, devicePixelRatio || 1); c.width = Math.round(feld.clientWidth * dpr); c.height = Math.round(feld.clientHeight * dpr); SKAL = c.width / W; x.setTransform(SKAL, 0, 0, c.height / H, 0, 0); x.imageSmoothingQuality = 'high'; }
addEventListener('resize', groesse);
const ohneBewegung = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Farben der Bäckerei ──
const F = {
  gold: '#FFC72C', goldDunkel: '#C98A00', creme: '#FFF6E4', papier: '#FFFBF2', braun: '#4B2A14', ink: '#2B170A',
  kruste: '#B8742E', krusteDunkel: '#7A4418', krume: '#F4D9A6', roggen: '#6E3F1E', mehl: 'rgba(255,250,240,.85)',
  gruen: '#2F9A47', rot: '#D0402A', holz: '#B07A45', holzDunkel: '#7C5128', stahl: '#9AA6B2'
};

// ── Hilfen ──
const zufall = (a, b) => a + Math.random() * (b - a);
const ganz = (a, b) => Math.floor(zufall(a, b + 1));
const klemm = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = { aus: (t) => 1 - Math.pow(1 - t, 3), ein: (t) => t * t * t, feder: (t) => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2), huepf: (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375; return n * (t -= 2.625 / d) * t + .984375; } };
/** Weg mit runden Ecken */
function rr(px, py, w, h, r){ r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); }
function linear(x1, y1, x2, y2, stops){ const g = x.createLinearGradient(x1, y1, x2, y2); stops.forEach(([o, f]) => g.addColorStop(o, f)); return g; }
function radial(px, py, r0, r1, stops, ox, oy){ const g = x.createRadialGradient(ox ?? px, oy ?? py, r0, px, py, r1); stops.forEach(([o, f]) => g.addColorStop(o, f)); return g; }
/** Weicher Schatten für das nächste Füllen */
function schatten(blur, oy, farbe){ x.shadowColor = farbe || 'rgba(40,20,5,.35)'; x.shadowBlur = blur * SKAL; x.shadowOffsetY = (oy || 0) * SKAL; x.shadowOffsetX = 0; }
function ohneSchatten(){ x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0; }
/** Bodenschatten (Ellipse) */
function bodenSchatten(px, py, rx, ry, a){ x.fillStyle = radial(px, py, 0, rx, [[0, `rgba(40,20,5,${a ?? .35})`], [1, 'rgba(40,20,5,0)']]); x.beginPath(); x.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2); x.fill(); }
/** Text mit leichtem Schatten */
function text(t, px, py, { gr = 16, farbe = F.ink, art = '800', schrift = 'Plus Jakarta Sans', ausr = 'center', schat = true } = {}){
  x.font = `${art} ${gr}px "${schrift}", system-ui, sans-serif`; x.textAlign = ausr; x.textBaseline = 'middle';
  if (schat) { x.fillStyle = 'rgba(40,20,5,.25)'; x.fillText(t, px, py + 1.5); }
  x.fillStyle = farbe; x.fillText(t, px, py);
}
/** Holz mit Maserung */
function holz(px, py, w, h, r = 6, hell = F.holz, dunkel = F.holzDunkel){
  rr(px, py, w, h, r); x.fillStyle = linear(0, py, 0, py + h, [[0, hell], [1, dunkel]]); x.fill();
  x.save(); rr(px, py, w, h, r); x.clip(); x.strokeStyle = 'rgba(70,40,15,.18)'; x.lineWidth = 1;
  for (let i = 0; i < h / 5; i++) { const yy = py + 3 + i * 5; x.beginPath(); x.moveTo(px, yy); for (let k = 0; k <= w; k += 20) x.lineTo(px + k, yy + Math.sin((k + i * 37) * .05) * 1.5); x.stroke(); }
  x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(px, py, w, 2); x.restore();
}
/** Weiche Vignette über das ganze Bild */
function vignette(a = .28){ x.fillStyle = radial(W / 2, H / 2, H * .35, H * .8, [[0, 'rgba(30,15,5,0)'], [1, `rgba(30,15,5,${a})`]]); x.fillRect(0, 0, W, H); }
/** Lichtkegel von oben (Backstuben-Lampe) */
function lampe(px, py, breite, a = .22){ x.fillStyle = linear(0, py, 0, py + 260, [[0, `rgba(255,236,180,${a})`], [1, 'rgba(255,236,180,0)']]); x.beginPath(); x.moveTo(px - 14, py); x.lineTo(px + 14, py); x.lineTo(px + breite, py + 260); x.lineTo(px - breite, py + 260); x.closePath(); x.fill(); }

// ── Brote, hochwertig gezeichnet ──
// art: 'laib' (dunkles rundes Roggenbrot), 'krusti' (helles ovales mit Schnitten), 'broetchen', 'brezel', 'baguette', 'stuten'
// opt.ton: 0 = roh/blass, 1 = perfekt, 2 = verbrannt; opt.rot: Drehung

function tour_rr(g, px, py, w, h, r){ r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(px + r, py); g.arcTo(px + w, py, px + w, py + h, r); g.arcTo(px + w, py + h, px, py + h, r); g.arcTo(px, py + h, px, py, r); g.arcTo(px, py, px + w, py, r); g.closePath(); }
function tour_lin(g, x1, y1, x2, y2, st){ const v = g.createLinearGradient(x1, y1, x2, y2); st.forEach(([o, f]) => v.addColorStop(o, f)); return v; }
function tour_rad(g, px, py, r0, r1, st, ox, oy){ const v = g.createRadialGradient(ox ?? px, oy ?? py, r0, px, py, r1); st.forEach(([o, f]) => v.addColorStop(o, f)); return v; }
const tour_zf = (i) => { const s = Math.sin(i * 91.17 + 7.31) * 43758.5453; return s - Math.floor(s); };
function tour_schatten(g, blur, ox, oy, a){ g.shadowColor = `rgba(30,18,8,${a ?? .4})`; g.shadowBlur = blur * 2; g.shadowOffsetX = ox * 2; g.shadowOffsetY = oy * 2; }
function tour_ohne(g){ g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0; }
function tour_hell(hex, k){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255; const f = (v) => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)); return `rgb(${f(r)},${f(gg)},${f(b)})`; }
/** Höhen-Verschiebung (Parallax): hohe Dinge am Rand wandern nach außen */
const tour_proj = (px, py, h) => [180 + (px - 180) * (1 + h), 300 + (py - 300) * (1 + h)];

// ── Hintergrund: Straße mit Gehwegen und Hausdächern, einmal gezeichnet ──
function tour_strasse(){
  return tour_leinwand(360, TOUR_KACHEL, (g) => {
    const K = TOUR_KACHEL;
    // Grund hinter den Häusern (Gärten, Höfe)
    g.fillStyle = '#8FB56C'; g.fillRect(0, 0, 360, K);
    for (let i = 0; i < 160; i++) { g.fillStyle = tour_zf(i) < .5 ? 'rgba(60,110,40,.25)' : 'rgba(200,230,150,.22)'; g.beginPath(); g.arc(tour_zf(i + 1) < .5 ? tour_zf(i + 2) * 44 : 316 + tour_zf(i + 2) * 44, tour_zf(i + 3) * K, 2 + tour_zf(i + 4) * 4, 0, 7); g.fill(); }
    // Häuser
    const dach = ['#B4513A', '#9C4431', '#5E6470', '#C0683F', '#7A4B35', '#A65A3E', '#6B717C'];
    for (const seite of [0, 1]) {
      let y = 4, i = seite * 31;
      while (y < K - 20) {
        let hh = 96 + Math.floor(tour_zf(i) * 80);
        const lueke = 8 + Math.floor(tour_zf(i + 5) * 14);
        if (K - (y + hh + lueke) < 90) hh = K - 4 - y - lueke;
        const farbe = dach[Math.floor(tour_zf(i + 9) * dach.length)];
        const x0 = seite ? 318 : -24, w = 66;
        // Hof in der Lücke
        if (tour_zf(i + 11) < .5) { g.fillStyle = '#B9AE9C'; g.fillRect(seite ? 318 : 0, y + hh, 42, lueke); }
        // Schatten des Hauses (Licht von oben links)
        tour_schatten(g, 6, 5, 6, .45); g.fillStyle = farbe; g.fillRect(x0, y, w, hh); tour_ohne(g);
        // Dach: zwei Flächen, First längs der Straße
        const first = seite ? 348 : 12;
        g.fillStyle = tour_lin(g, x0, 0, first, 0, [[0, tour_hell(farbe, .22)], [1, tour_hell(farbe, .08)]]); g.fillRect(x0, y, first - x0, hh);
        g.fillStyle = tour_lin(g, first, 0, x0 + w, 0, [[0, tour_hell(farbe, -.12)], [1, tour_hell(farbe, -.32)]]); g.fillRect(first, y, x0 + w - first, hh);
        // Ziegelreihen
        g.strokeStyle = 'rgba(40,15,5,.18)'; g.lineWidth = 1;
        for (let lx = x0 + 3; lx < x0 + w; lx += 4.5) { g.beginPath(); g.moveTo(lx, y); g.lineTo(lx, y + hh); g.stroke(); }
        g.fillStyle = 'rgba(40,15,5,.14)';
        for (let ly = y + 3, r = 0; ly < y + hh; ly += 6, r++) for (let lx = x0 + (r % 2) * 2.2; lx < x0 + w; lx += 4.5) g.fillRect(lx, ly, 3.2, 1);
        // First und Traufe
        g.fillStyle = 'rgba(255,240,220,.35)'; g.fillRect(first - 1, y, 2, hh);
        g.fillStyle = 'rgba(30,10,0,.35)'; g.fillRect(seite ? x0 : x0 + w - 2, y, 2, hh);
        g.fillStyle = 'rgba(255,255,255,.18)'; g.fillRect(x0, y, w, 1.5);
        // Schornstein oder Dachfenster
        if (tour_zf(i + 13) < .6) {
          const cy = y + 14 + tour_zf(i + 14) * (hh - 40), cx = seite ? 326 + tour_zf(i + 2) * 12 : 20 + tour_zf(i + 2) * 10;
          tour_schatten(g, 3, 3, 3, .45); g.fillStyle = '#8E5B45'; g.fillRect(cx, cy, 9, 9); tour_ohne(g);
          g.fillStyle = '#5A3526'; g.fillRect(cx + 2, cy + 2, 5, 5); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(cx, cy, 9, 1.5);
        } else {
          const cy = y + 18 + tour_zf(i + 15) * (hh - 46), cx = seite ? 324 : 22;
          g.fillStyle = tour_lin(g, cx, cy, cx + 12, cy + 16, [[0, '#BFD8EA'], [1, '#5F7F99']]); tour_rr(g, cx, cy, 12, 16, 2); g.fill();
          g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1; g.stroke();
        }
        y += hh + lueke; i += 3;
      }
    }
    // Gehwege
    for (const [gx, gw] of [[42, 26], [292, 26]]) {
      g.fillStyle = tour_lin(g, gx, 0, gx + gw, 0, [[0, '#D3C7B1'], [1, '#E2D8C5']]); g.fillRect(gx, 0, gw, K);
      for (let yy = 0; yy < K; yy += 13) for (let k = 0; k < 2; k++) { g.fillStyle = `rgba(${tour_zf(yy + k) < .5 ? '255,255,255' : '90,70,40'},${.05 + tour_zf(yy * 3 + k) * .07})`; g.fillRect(gx + k * 13 + .5, yy + .5, 12, 12); }
      g.strokeStyle = 'rgba(110,90,60,.28)'; g.lineWidth = .8;
      for (let yy = 0; yy < K; yy += 13) { g.beginPath(); g.moveTo(gx, yy); g.lineTo(gx + gw, yy); g.stroke(); }
      g.beginPath(); g.moveTo(gx + 13, 0); g.lineTo(gx + 13, K); g.stroke();
      // Schatten der Häuser auf dem Gehweg
      g.fillStyle = tour_lin(g, gx === 42 ? 42 : 292, 0, gx === 42 ? 52 : 302, 0, gx === 42 ? [[0, 'rgba(40,20,5,.22)'], [1, 'rgba(40,20,5,0)']] : [[0, 'rgba(40,20,5,0)'], [1, 'rgba(40,20,5,0)']]); g.fillRect(gx, 0, 10, K);
    }
    // Bordsteine
    for (const bx of [68, 288]) { g.fillStyle = '#F1EBDF'; g.fillRect(bx, 0, 4, K); g.fillStyle = 'rgba(60,40,20,.35)'; g.fillRect(bx === 68 ? 71 : 288, 0, 1, K); for (let yy = 0; yy < K; yy += 24) { g.fillStyle = 'rgba(90,70,40,.25)'; g.fillRect(bx, yy, 4, 1); } }
    // Asphalt
    g.fillStyle = tour_lin(g, 72, 0, 288, 0, [[0, '#4A4B52'], [.12, '#56575E'], [.5, '#5A5B62'], [.88, '#56575E'], [1, '#48494F']]); g.fillRect(72, 0, 216, K);
    for (let i = 0; i < 2600; i++) { const v = tour_zf(i * 7); g.fillStyle = v < .5 ? `rgba(255,255,255,${.04 + v * .08})` : `rgba(0,0,0,${.05 + (v - .5) * .12})`; g.fillRect(72 + tour_zf(i * 7 + 1) * 216, tour_zf(i * 7 + 2) * K, 1.2, 1.2); }
    // Fahrspuren (leicht dunkler, wo die Reifen rollen)
    for (const sx of TOUR_SPUR) for (const o of [-15, 15]) { g.fillStyle = 'rgba(20,20,25,.10)'; g.fillRect(sx + o - 4, 0, 8, K); }
    // Flicken und Gullys
    
    for (let i = 0; i < 4; i++) { const py = 60 + i * 240, px = i % 2 ? 279 : 76; g.fillStyle = '#3A3A40'; tour_rr(g, px, py, 6, 16, 1.5); g.fill(); g.fillStyle = '#6A6A70'; for (let k = 0; k < 4; k++) g.fillRect(px + 1, py + 2 + k * 3.6, 4, 1.4); }
    // Randlinien und Mittelstriche
    g.fillStyle = 'rgba(245,242,232,.9)'; g.fillRect(77, 0, 3, K); g.fillRect(280, 0, 3, K);
    for (const lx of [144, 216]) for (let yy = 0; yy < K; yy += 64) { g.fillStyle = 'rgba(245,242,232,.88)'; tour_rr(g, lx - 2, yy + 8, 4, 34, 1.5); g.fill(); g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(lx - 2, yy + 26, 4, 3); }
  });
}

// ── Lieferwagen (von oben, Fahrtrichtung nach oben) ──
function tour_wagenBild(){
  return tour_leinwand(72, 124, (g) => {
    g.translate(36, 62);
    const W2 = 25, L = 49;
    // Schatten und Räder
    tour_schatten(g, 7, 5, 7, .5); g.fillStyle = '#C08A00'; tour_rr(g, -W2, -L, W2 * 2, L * 2, 9); g.fill(); tour_ohne(g);
    g.fillStyle = '#1E1C1C'; for (const [rx, ry] of [[-W2 - 2, -33], [W2 - 3, -33], [-W2 - 2, 24], [W2 - 3, 24]]) { tour_rr(g, rx, ry, 5, 15, 2); g.fill(); }
    // Karosserie unten (Seiten sichtbar)
    g.fillStyle = tour_lin(g, -W2, 0, W2, 0, [[0, '#F2B200'], [.5, '#E0A100'], [1, '#B98200']]); tour_rr(g, -W2, -L, W2 * 2, L * 2, 9); g.fill();
    // Motorhaube
    g.fillStyle = tour_lin(g, 0, -L, 0, -L + 14, [[0, '#FFE58A'], [1, '#FFC72C']]); tour_rr(g, -W2 + 2, -L + 1, W2 * 2 - 4, 16, 8); g.fill();
    // Scheinwerfer
    for (const s of [-1, 1]) { g.fillStyle = tour_rad(g, s * 15, -L + 3, 0, 5, [[0, '#FFFFFF'], [.6, '#FFF3C4'], [1, '#E7C35A']]); g.beginPath(); g.ellipse(s * 15, -L + 3.5, 5, 2.6, 0, 0, 7); g.fill(); }
    g.fillStyle = '#3A2A18'; tour_rr(g, -8, -L + 1, 16, 3, 1.5); g.fill();
    // Spiegel
    for (const s of [-1, 1]) { g.fillStyle = '#2C2C30'; tour_rr(g, s > 0 ? W2 - 1 : -W2 - 6, -28, 7, 5, 2); g.fill(); g.fillStyle = '#8FB3CC'; tour_rr(g, s > 0 ? W2 + 1 : -W2 - 5, -27, 4, 3, 1); g.fill(); }
    // Frontscheibe
    g.fillStyle = tour_lin(g, -W2, -34, W2, -22, [[0, '#9FC4DE'], [.45, '#3F6684'], [1, '#22384C']]);
    g.beginPath(); g.moveTo(-W2 + 4, -33); g.lineTo(W2 - 4, -33); g.lineTo(W2 - 2, -22); g.lineTo(-W2 + 2, -22); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-W2 + 9, -24); g.lineTo(-W2 + 15, -32); g.moveTo(-W2 + 15, -24); g.lineTo(-W2 + 19, -30); g.stroke();
    // Kabinendach
    g.fillStyle = tour_lin(g, -W2, 0, W2, 0, [[0, '#FFE27A'], [.6, '#FFC72C'], [1, '#E2A40A']]); tour_rr(g, -W2 + 2, -22, W2 * 2 - 4, 12, 3); g.fill();
    // Kofferaufbau
    tour_schatten(g, 3, 0, 2, .35);
    g.fillStyle = tour_lin(g, -W2, 0, W2, 0, [[0, '#FFF0B0'], [.25, '#FFD84E'], [.75, '#FFC72C'], [1, '#E9AE12']]); tour_rr(g, -W2 + 1, -10, W2 * 2 - 2, L + 9, 5); g.fill(); tour_ohne(g);
    g.strokeStyle = 'rgba(150,100,0,.28)'; g.lineWidth = 1; for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(-W2 + 4, -2 + k * 10); g.lineTo(W2 - 4, -2 + k * 10); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,.4)'; tour_rr(g, -W2 + 3, -8, 4, L + 4, 2); g.fill();
    // Schriftzug längs, darunter kleine Ähre quer
    g.save(); g.rotate(-Math.PI / 2); g.font = '800 14px "Plus Jakarta Sans", system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,255,255,.45)'; g.fillText('HINKEL', -20, 1.5); g.fillStyle = '#4B2A14'; g.fillText('HINKEL', -20, 0); g.restore();
    g.save(); g.translate(0, -12); g.strokeStyle = '#4B2A14'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(-9, -4); g.lineTo(9, -4); g.stroke();
    g.fillStyle = '#4B2A14'; for (let k = 0; k < 3; k++) for (const s of [-1, 1]) { g.beginPath(); g.ellipse(-4 + k * 4, -4 + s * 2.4, 2.4, 1.3, s * -.5, 0, 7); g.fill(); } g.restore();
    // Rücklichter
    for (const s of [-1, 1]) { g.fillStyle = '#C62A1E'; tour_rr(g, s * 16 - 5, L - 3, 10, 3, 1.5); g.fill(); }
  });
}

// ── Autos im Gegenverkehr (Front nach unten) ──
function tour_autoBild(farbe, lang){
  const L = lang ? 46 : 37, Wd = lang ? 24 : 21;
  return tour_leinwand(64, 110, (g) => {
    g.translate(32, 55);
    tour_schatten(g, 6, 5, 6, .5); g.fillStyle = tour_hell(farbe, -.3); tour_rr(g, -Wd, -L, Wd * 2, L * 2, 10); g.fill(); tour_ohne(g);
    g.fillStyle = '#1C1C1E'; for (const [rx, ry] of [[-Wd - 2, -L + 10], [Wd - 3, -L + 10], [-Wd - 2, L - 24], [Wd - 3, L - 24]]) { tour_rr(g, rx, ry, 5, 13, 2); g.fill(); }
    g.fillStyle = tour_lin(g, -Wd, 0, Wd, 0, [[0, tour_hell(farbe, .25)], [.5, farbe], [1, tour_hell(farbe, -.25)]]); tour_rr(g, -Wd, -L, Wd * 2, L * 2, 10); g.fill();
    // Front unten: Haube, Scheinwerfer
    g.fillStyle = tour_lin(g, 0, L - 18, 0, L, [[0, tour_hell(farbe, .12)], [1, tour_hell(farbe, .3)]]); tour_rr(g, -Wd + 3, L - 18, Wd * 2 - 6, 16, 6); g.fill();
    for (const s of [-1, 1]) { g.fillStyle = '#FFF8DC'; g.beginPath(); g.ellipse(s * (Wd - 6), L - 3, 4.5, 2.2, 0, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(20,20,20,.55)'; tour_rr(g, -7, L - 3, 14, 2.5, 1); g.fill();
    // Frontscheibe (unten), Dach, Heckscheibe (oben)
    const glas = (y1, y2, breit) => { g.fillStyle = tour_lin(g, -Wd, y1, Wd, y2, [[0, '#A9CBE2'], [.5, '#3C5F7C'], [1, '#1F3344']]); g.beginPath(); g.moveTo(-Wd + breit, y1); g.lineTo(Wd - breit, y1); g.lineTo(Wd - 3, y2); g.lineTo(-Wd + 3, y2); g.closePath(); g.fill(); };
    glas(L - 32, L - 19, 3); g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(-Wd + 7, L - 21); g.lineTo(-Wd + 12, L - 30); g.stroke();
    g.fillStyle = tour_lin(g, -Wd, 0, Wd, 0, [[0, tour_hell(farbe, .35)], [.6, tour_hell(farbe, .1)], [1, tour_hell(farbe, -.15)]]); tour_rr(g, -Wd + 3, -L + 18, Wd * 2 - 6, L * 2 - 50, 5); g.fill();
    g.fillStyle = 'rgba(255,255,255,.22)'; tour_rr(g, -Wd + 5, -L + 20, 5, L * 2 - 54, 2); g.fill();
    g.fillStyle = tour_lin(g, 0, -L + 7, 0, -L + 18, [[0, '#1F3344'], [1, '#4C7090']]); tour_rr(g, -Wd + 4, -L + 7, Wd * 2 - 8, 10, 3); g.fill();
    if (lang) { g.fillStyle = 'rgba(0,0,0,.12)'; for (let k = 0; k < 3; k++) g.fillRect(-Wd + 4, -L + 30 + k * 12, Wd * 2 - 8, 1); }
    // Rücklichter oben, Spiegel
    for (const s of [-1, 1]) { g.fillStyle = '#B8241A'; tour_rr(g, s * (Wd - 6) - 4, -L + 1, 8, 3, 1.5); g.fill(); g.fillStyle = '#242428'; tour_rr(g, s > 0 ? Wd - 1 : -Wd - 5, L - 30, 6, 4, 2); g.fill(); }
  });
}

// ── Baustelle: Baken und Absperrschranke ──
function tour_bauBild(){
  return tour_leinwand(76, 56, (g) => {
    g.translate(38, 28);
    // Schranke
    tour_schatten(g, 4, 4, 5, .45); g.fillStyle = '#FFFFFF'; tour_rr(g, -32, -6, 64, 9, 3); g.fill(); tour_ohne(g);
    g.save(); tour_rr(g, -32, -6, 64, 9, 3); g.clip(); g.fillStyle = '#D9372A'; for (let k = -40; k < 40; k += 12) { g.beginPath(); g.moveTo(k, -6); g.lineTo(k + 6, -6); g.lineTo(k + 15, 3); g.lineTo(k + 9, 3); g.closePath(); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(-32, -6, 64, 2); g.restore();
    // Baken (Kegel von oben)
    for (const bx of [-24, 0, 24]) {
      tour_schatten(g, 3, 3, 4, .45); g.fillStyle = '#2B2B2E'; tour_rr(g, bx - 8, 6, 16, 14, 3); g.fill(); tour_ohne(g);
      g.fillStyle = tour_rad(g, bx, 12, 1, 9, [[0, '#FFB25A'], [.5, '#F07E1E'], [1, '#B8520C']], bx - 2, 10); g.beginPath(); g.arc(bx, 13, 7.5, 0, 7); g.fill();
      g.strokeStyle = '#FFFFFF'; g.lineWidth = 2; g.beginPath(); g.arc(bx, 13, 4.6, 0, 7); g.stroke();
      g.fillStyle = '#E86A12'; g.beginPath(); g.arc(bx, 13, 2.2, 0, 7); g.fill();
    }
    // Warnlampe
    g.fillStyle = '#3A3A3A'; tour_rr(g, -5, -15, 10, 9, 2); g.fill();
  });
}

// ── Baum (Krone von oben) ──
function tour_baumBild(){
  return tour_leinwand(64, 64, (g) => {
    g.translate(32, 32);
    const teile = [[0, 0, 19], [-10, -8, 12], [10, -7, 12], [-11, 8, 12], [9, 10, 12], [0, -13, 10], [0, 13, 10]];
    tour_schatten(g, 6, 5, 6, .45); g.fillStyle = '#2E6B2E'; g.beginPath(); for (const [a, b, r] of teile) { g.moveTo(a + r, b); g.arc(a, b, r, 0, 7); } g.fill(); tour_ohne(g);
    for (const [a, b, r] of teile) { g.fillStyle = tour_rad(g, a, b, 1, r, [[0, '#8FCB5E'], [.55, '#4E9A3C'], [1, '#2F6E2C']], a - r * .4, b - r * .45); g.beginPath(); g.arc(a, b, r, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(255,255,220,.22)'; for (let k = 0; k < 14; k++) { g.beginPath(); g.arc(-14 + tour_zf(k) * 22, -14 + tour_zf(k + 20) * 20, 1.6, 0, 7); g.fill(); }
  });
}

// ── Schnee am Rand: durchsichtige Kachel, liegt über der Straße, wenn es schneit ──
function tour_schneeKachel(){
  return tour_leinwand(360, TOUR_KACHEL, (g) => {
    const K = TOUR_KACHEL;
    const flocke = (px, py, r, a) => { g.fillStyle = tour_rad(g, px, py, 0, r, [[0, `rgba(255,255,255,${a})`], [.7, `rgba(246,250,255,${a * .85})`], [1, 'rgba(240,246,255,0)']]); g.beginPath(); g.arc(px, py, r, 0, 7); g.fill(); };
    // Dächer und Höfe fast ganz weiß
    for (const [x0, x1] of [[0, 42], [318, 360]]) {
      g.fillStyle = 'rgba(250,252,255,.72)'; g.fillRect(x0, 0, x1 - x0, K);
      for (let i = 0; i < 90; i++) flocke(x0 + tour_zf(i + x0) * (x1 - x0), tour_zf(i * 3 + x0) * K, 6 + tour_zf(i + 7) * 8, .5);
      g.fillStyle = 'rgba(150,170,200,.16)'; for (let i = 0; i < 40; i++) g.fillRect(x0 + tour_zf(i + 99) * (x1 - x0), tour_zf(i + 300) * K, 1.4, 6);
    }
    // Gehwege fleckig, am Bordstein ein Schneewall
    for (const [gx, gw] of [[42, 26], [292, 26]]) for (let i = 0; i < 70; i++) flocke(gx + tour_zf(i + gx) * gw, tour_zf(i * 5 + gx) * K, 5 + tour_zf(i + 11) * 7, .55);
    for (const [bx, r] of [[70, 1], [290, -1]]) for (let yy = 0; yy < K; yy += 7) flocke(bx + r * tour_zf(yy) * 3, yy, 5 + tour_zf(yy + 5) * 3, .9);
    // etwas Schneematsch am Fahrbahnrand
    for (let yy = 0; yy < K; yy += 9) { flocke(79 + tour_zf(yy + 1) * 4, yy, 3 + tour_zf(yy + 2) * 3, .45); flocke(281 - tour_zf(yy + 3) * 4, yy, 3 + tour_zf(yy + 4) * 3, .45); }
  });
}

/** Goldlaib: ganz seltenes Goldstück im Brot-Stapler */
function stap_goldLaib(cx, cy, w, h){
  x.save(); x.translate(cx, cy);

/** Ein (evtl. abgeschnittenes) Brot zeichnen: volles Brot bei fx mit Breite fw, sichtbar nur zwischen l und r */
function stap_stueck(s, cy, { glanz = 0 } = {}){
  const h = s.h;
  x.save();
  x.beginPath(); x.rect(s.l, cy - h, s.r - s.l, h * 2); x.clip();
  if (s.gold) stap_goldLaib(s.fx, cy, s.fw, h);
  else brot(s.art, s.fx, cy, s.fw, h, { schatten: false, ton: s.ton ?? 1, mohn: s.mohn });
  if (s.art === 'stuten' && !s.gold) {
    // aufgerissene Oberseite wie beim echten Stuten, dazu Backform-Kante
    const ky = cy - h * .2, a = s.fw * .36;
    x.lineCap = 'round';
    x.strokeStyle = 'rgba(110,55,15,.5)'; x.lineWidth = 4; x.beginPath(); x.moveTo(s.fx - a, ky + 1); x.bezierCurveTo(s.fx - a * .4, ky - 3, s.fx + a * .4, ky + 3, s.fx + a, ky - 1); x.stroke();
    x.strokeStyle = 'rgba(255,226,170,.9)'; x.lineWidth = 2; x.beginPath(); x.moveTo(s.fx - a, ky); x.bezierCurveTo(s.fx - a * .4, ky - 4, s.fx + a * .4, ky + 2, s.fx + a, ky - 2); x.stroke();
    x.fillStyle = 'rgba(70,30,5,.22)'; x.fillRect(s.fx - s.fw / 2, cy + h * .3, s.fw, h * .2);
  }
  x.restore();
  // Schnittflächen mit heller Krume
  const flaeche = (kx, seite) => {
    const u = klemm((kx - s.fx) / (s.fw / 2), -1, 1);
    const rund = s.art === 'laib' || s.art === 'krusti';
    const hh = rund ? h / 2 * Math.sqrt(Math.max(0, 1 - u * u)) : s.art === 'baguette' ? h / 2 * (Math.abs(u) > .8 ? Math.sqrt(Math.max(0, 1 - Math.pow((Math.abs(u) - .8) / .2, 2))) : 1) : h * .41;
    if (hh < 2) return;
    const my = s.art === 'stuten' ? cy + h * .09 : cy;
    const fx = kx - seite * 2.6;
    x.fillStyle = linear(fx - 3, my - hh, fx + 3, my + hh, s.art === 'laib' ? [[0, '#D8B48A'], [1, '#A9825A']] : [[0, '#FFF1D2'], [1, '#E5C48C']]);
    x.beginPath(); x.ellipse(fx, my, 3.4, hh * .94, 0, 0, 7); x.fill();
    x.fillStyle = 'rgba(150,100,50,.35)'; for (let i = 0; i < 4; i++) { x.beginPath(); x.arc(fx + (i % 2 - .5), my - hh * .5 + i * hh * .32, .8, 0, 7); x.fill(); }
  };
  if (s.l > s.fx - s.fw / 2 + .8) flaeche(s.l, -1);
  if (s.r < s.fx + s.fw / 2 - .8) flaeche(s.r, 1);
  if (glanz > 0) {
    x.save(); x.globalAlpha = glanz;
    x.fillStyle = radial((s.l + s.r) / 2, cy, 4, (s.r - s.l) * .7, [[0, 'rgba(255,236,150,.85)'], [1, 'rgba(255,200,60,0)']]);
    x.fillRect(s.l - 40, cy - h * 1.6, s.r - s.l + 80, h * 3.2);
    x.restore();
  }
}
